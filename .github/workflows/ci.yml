# Integración continua: cada push y cada pull request hacia develop o main corre las pruebas unitarias, el build
# del frontend y la revisión de secretos. Las pruebas no salen a la red: el LLM y Supabase están simulados, así que
# no hacen falta secretos.
#
# Los cinco chequeos son BLOQUEANTES: develop y main están protegidas y exigen los cinco en verde para fusionar un
# PR, también a los administradores. Si una prueba unitaria falla, el cambio no entra.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    # También los PR de subtarea hacia la rama de su historia (feature/AISCOP-<id>-...)
    branches: [develop, main, "feature/**"]

jobs:
  api:
    name: API · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-api
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Python 3.11 (la misma versión del Dockerfile de la API)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-api/requirements*.txt
      - name: Instalar dependencias de prueba
        run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias e integración de la API (bloqueantes)
        run: pytest -q

  evaluacion:
    name: Evaluación · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evaluation/requirements*.txt
      - name: Instalar dependencias de la evaluación
        run: pip install -r evaluation/requirements-dev.txt
      - name: Pruebas unitarias de las métricas del modelo (bloqueantes)
        run: pytest -q evaluation/tests

  frontend_pruebas:
    name: Frontend · pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node 20 (la misma versión que usa Render)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Prueba pequeña y evidente (AISCOP-70): la cabecera nombra el producto. Sin dependencias: node:test.
      - name: Pruebas unitarias del frontend (bloqueantes)
        run: node --test frontend/tests/

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar Node 20 (la misma versión que usa Render)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci instala exactamente package-lock.json: el mismo árbol que construye Render (HU-10)
      - name: Instalar dependencias exactas (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Construir el frontend como en producción
        run: npm run build

  secretos:
    name: Seguridad · secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo el historial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # revisa también todo el historial, no solo el último commit
      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # HU-10, CA-2: ningún secreto en el repositorio. Falla si aparece una llave que no esté
      # entre las excepciones revisadas (deploy/revisar_secretos.py).
      - name: Revisar que no haya secretos en el código ni en el historial
        run: python deploy/revisar_secretos.py
